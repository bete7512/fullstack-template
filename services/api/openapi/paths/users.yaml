users:
  get:
    operationId: listUsers
    tags: [users]
    summary: List users
    description: Paginated with limit and offset, sorted by `sort_by` (default id) and `sort_dir` (default asc).
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: search
        in: query
        required: false
        description: Case-insensitive match on email or name.
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum: [id, email, name, createdAt]
          default: id
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
          default: asc
    responses:
      '200':
        description: A page of users.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserList'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'
  post:
    operationId: createUser
    tags: [users]
    summary: Register a user
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
    responses:
      '201':
        description: User created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

user:
  parameters:
    - $ref: '#/components/parameters/UserId'
  get:
    operationId: getUser
    tags: [users]
    summary: Get a user
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: The user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'
  patch:
    operationId: updateUser
    tags: [users]
    summary: Update a user's profile
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
    responses:
      '200':
        description: The updated user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'
  delete:
    operationId: deleteUser
    tags: [users]
    summary: Delete a user
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '204':
        description: Deleted.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

userPassword:
  put:
    operationId: changeUserPassword
    tags: [users]
    summary: Change a user's password
    description: Requires the current password. Signs the user out of every session.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/UserId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangePasswordRequest'
    responses:
      '204':
        description: Password changed.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

components:
  schemas:
    User:
      type: object
      required: [id, email, name, emailVerified, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          maxLength: 120
          example: Ada Lovelace
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          description: Number of users matching the filter.
          example: 42

    CreateUserRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          maxLength: 120
          example: Ada Lovelace
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256

    UpdateUserRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
          example: Ada King

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 256

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
