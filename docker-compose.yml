name: scaffold

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scaffold}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scaffold}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Mirrors what we will set on RDS; keeps local behaviour honest.
    command:
      - postgres
      - -c
      - log_min_duration_statement=250ms
      - -c
      - max_connections=100

  # SNS + SQS stand-ins for the events transport; deploy/localstack/init.sh creates the topic and queues.
  localstack:
    image: localstack/localstack:4.9
    profiles: [queue]
    environment:
      SERVICES: sns,sqs
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    # Healthy only once the init script has run, so `up --wait` returns with the topic and queues in place.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health && curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 2s
      timeout: 5s
      retries: 60

  # SMTP sink with a web inbox on :8025 for the mailer.
  mailpit:
    image: axllent/mailpit:v1.28
    profiles: [queue]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
