# Root OpenAPI document. Run `make gen-openapi` after any change.
openapi: 3.0.3

info:
  title: scaffold API
  version: 0.1.0
  description: Errors are JSON `Error` objects; every response carries an `X-Request-Id` header.
  contact:
    name: scaffold maintainers
    url: https://github.com/bete7512/scaffold
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development (`make dev`)

tags:
  - name: system
    description: Liveness / readiness probes used by the load balancer and orchestrator.
  - name: auth
    description: Login, token refresh and logout.
  - name: users
    description: User registration and profile.

paths:
  /healthz:
    $ref: './paths/health.yaml#/healthz'
  /readyz:
    $ref: './paths/health.yaml#/readyz'
  /v1/users:
    $ref: './paths/users.yaml#/users'
  /v1/users/{id}:
    $ref: './paths/users.yaml#/user'
  /v1/users/{id}/password:
    $ref: './paths/users.yaml#/userPassword'
  /v1/me:
    $ref: './paths/me.yaml#/me'
  /v1/auth/login:
    $ref: './paths/auth.yaml#/login'
  /v1/auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /v1/auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /v1/auth/logout-all:
    $ref: './paths/auth.yaml#/logoutAll'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
