components:
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
    ValidationFailed:
      description: The request failed validation; `fields` lists the problems.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
    Unavailable:
      description: A dependency is down.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
