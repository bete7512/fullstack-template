# Liveness and readiness probes; unauthenticated.

healthz:
  get:
    operationId: getHealthz
    tags: [system]
    summary: Liveness probe
    description: Reports that the process is up and serving; never checks dependencies, so a database blip does not get the task killed.
    security: []
    responses:
      '200':
        description: Process is alive.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Health'

readyz:
  get:
    operationId: getReadyz
    tags: [system]
    summary: Readiness probe
    description: Pings every hard dependency (currently Postgres) and returns 503 with per-check detail when any is down, so the load balancer takes this replica out of rotation.
    security: []
    responses:
      '200':
        description: All dependency checks passed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Readiness'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            db: ok
